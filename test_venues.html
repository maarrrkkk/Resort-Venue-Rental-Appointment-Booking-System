<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venue Loading Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Venue Loading Test</h1>
        <div id="status" class="alert alert-info">Testing venue loading...</div>
        <div id="venuesContainer" class="row"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Test script to verify venue loading works
        class TestVenueLoader {
            constructor() {
                this.baseURL = this.getBaseURL();
                this.init();
            }

            getBaseURL() {
                const path = window.location.pathname;
                if (path.includes('/admin/')) {
                    return '../api/';
                } else if (path.includes('/client/')) {
                    return '../api/';
                } else {
                    return 'api/';
                }
            }

            async init() {
                try {
                    this.updateStatus('Loading venues from: ' + this.baseURL + 'venues.php', 'info');
                    
                    const response = await fetch(this.baseURL + 'venues.php');
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    const venues = await response.json();
                    
                    if (Array.isArray(venues)) {
                        this.updateStatus(`Successfully loaded ${venues.length} venues!`, 'success');
                        this.displayVenues(venues);
                    } else {
                        this.updateStatus('Unexpected response format', 'warning');
                        console.log('Response:', venues);
                    }
                    
                } catch (error) {
                    this.updateStatus(`Error: ${error.message}`, 'danger');
                    console.error('Venue loading error:', error);
                }
            }

            updateStatus(message, type) {
                const statusDiv = document.getElementById('status');
                statusDiv.className = `alert alert-${type}`;
                statusDiv.textContent = message;
            }

            displayVenues(venues) {
                const container = document.getElementById('venuesContainer');
                container.innerHTML = venues.map(venue => `
                    <div class="col-md-4 mb-3">
                        <div class="card">
                            <div class="card-body">
                                <h5>${venue.name}</h5>
                                <p>${venue.description}</p>
                                <p><strong>Price:</strong> ₱${venue.price}</p>
                                <p><strong>Capacity:</strong> ${venue.capacity}</p>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        }

        // Initialize test when page loads
        document.addEventListener('DOMContentLoaded', function() {
            new TestVenueLoader();
        });
    </script>
</body>
</html>
