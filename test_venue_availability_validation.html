<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venue Availability Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .venue-card {
            transition: all 0.3s ease;
        }
        .venue-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .availability-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
        }
        .test-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">
            <i class="fas fa-calendar-check text-primary"></i>
            Venue Availability Validation Test
        </h1>

        <!-- Test Controls -->
        <div class="test-section">
            <h3><i class="fas fa-cogs"></i> Test Controls</h3>
            <div class="row">
                <div class="col-md-6">
                    <label for="testVenue" class="form-label">Select Venue:</label>
                    <select id="testVenue" class="form-select">
                        <option value="venue1">Grand Ballroom</option>
                        <option value="venue2">Oceanview Terrace</option>
                        <option value="venue3">Executive Conference Center</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="testDate" class="form-label">Test Date:</label>
                    <input type="date" id="testDate" class="form-control">
                </div>
            </div>
            <div class="mt-3">
                <button id="checkAvailability" class="btn btn-primary">
                    <i class="fas fa-search"></i> Check Availability
                </button>
                <button id="createTestBooking" class="btn btn-success ms-2">
                    <i class="fas fa-plus"></i> Create Test Booking
                </button>
                <button id="refreshVenues" class="btn btn-info ms-2">
                    <i class="fas fa-refresh"></i> Refresh Venue Status
                </button>
            </div>
        </div>

        <!-- Test Results -->
        <div class="test-section">
            <h3><i class="fas fa-chart-line"></i> Test Results</h3>
            <div id="testResults" class="alert alert-info">
                <i class="fas fa-info-circle"></i> Click "Check Availability" to test the venue availability system.
            </div>
        </div>

        <!-- Venue Grid -->
        <div class="test-section">
            <h3><i class="fas fa-building"></i> Venue Status Grid</h3>
            <p class="text-muted">This grid shows the current availability status of all venues with the new double-booking prevention system.</p>
            <div id="venuesGrid" class="row g-4">
                <!-- Venues will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        // Test venue availability system
        class VenueAvailabilityTest {
            constructor() {
                this.init();
                this.loadVenues();
            }

            init() {
                // Set today's date as default
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('testDate').value = today;

                // Event listeners
                document.getElementById('checkAvailability').addEventListener('click', () => this.checkAvailability());
                document.getElementById('createTestBooking').addEventListener('click', () => this.createTestBooking());
                document.getElementById('refreshVenues').addEventListener('click', () => this.loadVenues());
            }

            async loadVenues() {
                try {
                    const response = await fetch('api/venues.php');
                    const venues = await response.json();
                    
                    // Load availability for each venue
                    const venuesWithAvailability = await Promise.all(venues.map(async (venue) => {
                        const availabilityData = await this.getVenueAvailability(venue.id);
                        return {
                            ...venue,
                            availabilityData,
                            availableDates: availabilityData.filter(a => a.available).length,
                            totalDates: availabilityData.length
                        };
                    }));

                    this.renderVenues(venuesWithAvailability);
                } catch (error) {
                    console.error('Error loading venues:', error);
                    document.getElementById('testResults').innerHTML = 
                        '<div class="alert alert-danger"><i class="fas fa-exclamation-triangle"></i> Error loading venues: ' + error.message + '</div>';
                }
            }

            async getVenueAvailability(venueId) {
                try {
                    const today = new Date();
                    const futureDate = new Date(today);
                    futureDate.setDate(futureDate.getDate() + 30);
                    
                    const startDate = today.toISOString().split('T')[0];
                    const endDate = futureDate.toISOString().split('T')[0];
                    
                    const response = await fetch(`api/venueAvailability.php?venue_id=${venueId}&start_date=${startDate}&end_date=${endDate}`);
                    const data = await response.json();
                    
                    return data.success ? data.availability : [];
                } catch (error) {
                    console.warn(`Failed to get availability for ${venueId}:`, error);
                    return [];
                }
            }

            renderVenues(venues) {
                const grid = document.getElementById('venuesGrid');
                grid.innerHTML = venues.map(venue => {
                    const availabilityPercentage = (venue.availableDates / venue.totalDates) * 100;
                    
                    let statusBadge = '';
                    let statusClass = '';
                    let statusText = '';
                    
                    if (availabilityPercentage === 0) {
                        statusBadge = '<span class="badge bg-danger availability-indicator">Fully Booked</span>';
                        statusClass = 'border-danger';
                        statusText = 'No availability in next 30 days';
                    } else if (availabilityPercentage < 50) {
                        statusBadge = '<span class="badge bg-warning availability-indicator">Limited</span>';
                        statusClass = 'border-warning';
                        statusText = `${venue.availableDates} of ${venue.totalDates} days available`;
                    } else {
                        statusBadge = '<span class="badge bg-success availability-indicator">Available</span>';
                        statusClass = 'border-success';
                        statusText = `${venue.availableDates} of ${venue.totalDates} days available`;
                    }

                    return `
                        <div class="col-lg-4 col-md-6">
                            <div class="card venue-card h-100 ${statusClass}">
                                <div class="position-relative">
                                    <img src="${venue.images[0]}" class="card-img-top" alt="${venue.name}" style="height: 200px; object-fit: cover;">
                                    ${statusBadge}
                                </div>
                                <div class="card-body">
                                    <h5 class="card-title">${venue.name}</h5>
                                    <p class="card-text text-muted">${venue.description.substring(0, 100)}...</p>
                                    <div class="d-flex justify-content-between align-items-center">
                                        <small class="text-muted">
                                            <i class="fas fa-users me-1"></i>
                                            ${venue.capacity} guests
                                        </small>
                                        <small class="text-muted">
                                            <i class="fas fa-dollar-sign me-1"></i>
                                            ₱${venue.price.toLocaleString()}
                                        </small>
                                    </div>
                                    <hr>
                                    <p class="small mb-2">
                                        <i class="fas fa-calendar me-1"></i>
                                        ${statusText}
                                    </p>
                                    <div class="progress mb-2" style="height: 8px;">
                                        <div class="progress-bar ${availabilityPercentage === 0 ? 'bg-danger' : availabilityPercentage < 50 ? 'bg-warning' : 'bg-success'}" 
                                             style="width: ${availabilityPercentage}%"></div>
                                    </div>
                                    <button class="btn btn-sm btn-outline-primary w-100" onclick="testSystem.checkSpecificVenue('${venue.id}')">
                                        <i class="fas fa-test-tube me-1"></i>
                                        Test This Venue
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            async checkAvailability() {
                const venueId = document.getElementById('testVenue').value;
                const testDate = document.getElementById('testDate').value;
                
                if (!testDate) {
                    this.showResult('Please select a test date.', 'warning');
                    return;
                }

                try {
                    this.showResult('<i class="fas fa-spinner fa-spin"></i> Checking availability...', 'info');
                    
                    const response = await fetch(`api/checkAvailability.php?venue_id=${venueId}&date=${testDate}`);
                    const data = await response.json();
                    
                    if (data.available) {
                        this.showResult(`<i class="fas fa-check-circle text-success"></i> <strong>SUCCESS:</strong> Venue is available on ${testDate}. No existing bookings found.`, 'success');
                    } else {
                        this.showResult(`<i class="fas fa-times-circle text-danger"></i> <strong>DOUBLE-BOOKING PREVENTED:</strong> ${data.message}`, 'danger');
                    }
                } catch (error) {
                    this.showResult(`<i class="fas fa-exclamation-triangle"></i> Error: ${error.message}`, 'danger');
                }
            }

            async createTestBooking() {
                const venueId = document.getElementById('testVenue').value;
                const testDate = document.getElementById('testDate').value;
                
                if (!testDate) {
                    this.showResult('Please select a test date.', 'warning');
                    return;
                }

                try {
                    this.showResult('<i class="fas fa-spinner fa-spin"></i> Creating test booking...', 'info');
                    
                    const bookingData = {
                        venue_id: venueId,
                        user_id: 'test_user_' + Date.now(),
                        booking_date: testDate,
                        guest_count: 50,
                        event_type: 'Test Event',
                        special_requests: 'Test booking for availability validation',
                        total_amount: 5000,
                        payment_method: 'test',
                        payment_type: 'test'
                    };

                    const response = await fetch('api/createBooking.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(bookingData)
                    });

                    const data = await response.json();
                    
                    if (data.success) {
                        this.showResult(`<i class="fas fa-check-circle text-success"></i> <strong>BOOKING CREATED:</strong> Test booking ${data.booking_id} created successfully. The venue should now show as unavailable for ${testDate}.`, 'success');
                        // Refresh venue status
                        setTimeout(() => this.loadVenues(), 2000);
                    } else {
                        this.showResult(`<i class="fas fa-times-circle text-danger"></i> <strong>BOOKING FAILED:</strong> ${data.error}`, 'danger');
                    }
                } catch (error) {
                    this.showResult(`<i class="fas fa-exclamation-triangle"></i> Error: ${error.message}`, 'danger');
                }
            }

            checkSpecificVenue(venueId) {
                document.getElementById('testVenue').value = venueId;
                this.checkAvailability();
            }

            showResult(message, type) {
                const resultsDiv = document.getElementById('testResults');
                resultsDiv.className = `alert alert-${type}`;
                resultsDiv.innerHTML = message;
            }
        }

        // Initialize test system
        const testSystem = new VenueAvailabilityTest();
    </script>
</body>
</html>
