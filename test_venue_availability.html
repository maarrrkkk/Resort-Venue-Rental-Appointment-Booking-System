<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venue Availability Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Venue Availability Test</h1>
        
        <div class="card">
            <div class="card-body">
                <h5>Test Date Selection</h5>
                <div class="input-group mb-3">
                    <input type="date" class="form-control" id="testDateInput" min="">
                    <button class="btn btn-primary" type="button" id="testAvailabilityBtn">
                        <i class="fas fa-search me-1"></i>Test Availability
                    </button>
                </div>
                
                <div id="testResults" class="mt-3">
                    <p class="text-muted">Select a date and click "Test Availability" to see results.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Set minimum date to today
        const testDateInput = document.getElementById('testDateInput');
        const testAvailabilityBtn = document.getElementById('testAvailabilityBtn');
        const testResults = document.getElementById('testResults');
        
        const today = new Date().toISOString().split('T')[0];
        testDateInput.min = today;
        
        testAvailabilityBtn.addEventListener('click', async function() {
            const selectedDate = testDateInput.value;
            
            if (!selectedDate) {
                alert('Please select a date first.');
                return;
            }
            
            testResults.innerHTML = '<div class="alert alert-info">Loading venues...</div>';
            
            try {
                // Test the API endpoint
                const response = await fetch(`api/venues.php?date=${encodeURIComponent(selectedDate)}`);
                const venues = await response.json();
                
                if (response.ok) {
                    let html = `<h6>Venue Availability for ${selectedDate}</h6>`;
                    
                    if (venues.length === 0) {
                        html += '<p class="text-muted">No venues found.</p>';
                    } else {
                        venues.forEach(venue => {
                            const status = venue.availability ? 
                                '<span class="badge bg-success">Available</span>' : 
                                '<span class="badge bg-danger">Unavailable</span>';
                            
                            html += `
                                <div class="card mb-2">
                                    <div class="card-body">
                                        <h6>${venue.name} ${status}</h6>
                                        <p class="text-muted mb-1">${venue.description}</p>
                                        <small class="text-muted">
                                            <i class="fas fa-users me-1"></i>${venue.capacity} guests | 
                                            <i class="fas fa-dollar-sign me-1"></i>₱${venue.price.toLocaleString()}
                                        </small>
                                    </div>
                                </div>
                            `;
                        });
                    }
                    
                    testResults.innerHTML = html;
                } else {
                    testResults.innerHTML = '<div class="alert alert-danger">Error loading venues: ' + (venues.error || 'Unknown error') + '</div>';
                }
            } catch (error) {
                testResults.innerHTML = '<div class="alert alert-danger">Network error: ' + error.message + '</div>';
            }
        });
    </script>
</body>
</html>
